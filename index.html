<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web Proxy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }

    header { padding: 10px 16px; background: #1e1e1e; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
    .title { font-weight: bold; color: #4fc3f7; text-decoration: none; white-space: nowrap; }
    form { flex: 1; display: flex; gap: 8px; }
    input { flex: 1; padding: 8px 14px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
    select { padding: 8px 10px; border-radius: 20px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; max-width: 190px; }
    button { padding: 8px 18px; border-radius: 20px; border: none; background: #0288d1; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #0277bd; }

    main { flex: 1; position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
    .info { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #121212; color: #aaa; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <header>
    <a href="#/search" class="title">Proxy Search</a>
    <form id="searchForm">
      <input type="text" id="urlInput" placeholder="URL / 検索ワード / YouTubeのURLか動画ID" required />
      <select id="ytMode" title="YouTube動画の開き方">
        <option value="proxy">YouTube: ①プロキシ経由</option>
        <option value="direct">YouTube: ②直接埋め込み</option>
        <option value="invidious">YouTube: ③Invidious経由</option>
      </select>
      <button type="submit">開く</button>
    </form>
  </header>

  <main>
    <div id="info" class="info">
      <h2>Web Proxy</h2>
      <p style="margin-top: 8px;">URLや検索ワードを入力できます。</p>
      <p style="margin-top: 8px;">YouTubeの動画は、URLか動画ID(11文字)を入れて、右のモードを切り替えて試せます。</p>
    </div>
    <iframe id="proxyFrame" style="display: none;" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </main>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('urlInput');
    const frame = document.getElementById('proxyFrame');
    const info = document.getElementById('info');
    const ytMode = document.getElementById('ytMode');

    // 自分専用の Cloudflare Worker URL
    const PROXY_API = 'https://modzexe.kdkfkdk766.workers.dev/?url=';
    // Invidiousのインスタンス(落ちていたら別のものに変更)
    const INVIDIOUS = 'https://yewtu.be';
    // 検索エンジン
    const SEARCH = 'https://www.bing.com/search?q=';

    // 入力からYouTubeの動画IDを取り出す(なければ null)
    function parseVideoId(text) {
      const m = text.match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
      if (m) return m[1];
      if (/^(?=.*[0-9A-Z_-])[A-Za-z0-9_-]{11}$/.test(text)) return text;
      return null;
    }

    function show(src) {
      info.style.display = 'none';
      frame.style.display = 'block';
      frame.src = src;
    }

    function openSite(target) {
      let url = target.trim();

      // YouTube動画
      const id = parseVideoId(url);
      if (id) {
        const mode = ytMode.value;
        if (mode === 'direct') {
          show('https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1');
          return;
        }
        url = mode === 'invidious'
          ? INVIDIOUS + '/embed/' + id
          : 'https://www.youtube.com/embed/' + id + '?autoplay=1';
        location.hash = `/search?url=${encodeURIComponent(url)}`;
        show(PROXY_API + encodeURIComponent(url));
        return;
      }

      // 通常のURL・検索
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        if (url.includes('.') && !url.includes(' ')) {
          url = 'https://' + url;
        } else {
          url = SEARCH + encodeURIComponent(url);
        }
      }

      location.hash = `/search?url=${encodeURIComponent(url)}`;
      show(PROXY_API + encodeURIComponent(url));
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      openSite(input.value);
    });

    function checkHash() {
      const hash = location.hash;
      if (hash.includes('url=')) {
        const url = decodeURIComponent(hash.split('url=')[1]);
        input.value = url;
        openSite(url);
      }
    }

    window.addEventListener('load', checkHash);
    window.addEventListener('hashchange', checkHash);
  </script>
</body>
</html>
